# [시험용 브랜치 전용] football-data.co.uk 이번 시즌 CSV를 받아 이 브랜치에 저장한다. main에는 넣지 않는다.
name: probe-fd-test
on:
  push:
    branches: [test/understat-fallback]
    paths: [".github/workflows/probe-fd-test.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 이번 시즌 CSV 받기
        run: |
          mkdir -p probe
          curl -sSL -A "Mozilla/5.0" -o probe/E0_2627.csv https://www.football-data.co.uk/mmz4281/2627/E0.csv
          curl -sSL -A "Mozilla/5.0" -o probe/understat_home.html https://understat.com/ || true
          ls -l probe
          head -3 probe/E0_2627.csv
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "시험: 이번 시즌 CSV 받기"
          git push
