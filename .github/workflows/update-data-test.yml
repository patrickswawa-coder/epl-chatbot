# [시험용] GitHub 서버에서 데이터 출처에 접속되는지만 확인한다. DB를 커밋하지 않는다.
name: data-update-test
on:
  push:
    branches: [test/auto-update]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Understat 접속 확인
        continue-on-error: true
        run: |
          curl -sS -A "Mozilla/5.0" -o /tmp/u.html -w "HTTP %{http_code}, %{size_download} bytes\n" https://understat.com/league/EPL/2026
          head -c 600 /tmp/u.html; echo
          grep -c "datesData\|teamsData" /tmp/u.html || true
          grep -io "cloudflare\|captcha\|access denied\|just a moment" /tmp/u.html | sort | uniq -c || true
      - name: football-data.co.uk 접속 확인
        continue-on-error: true
        run: |
          curl -sS -o /tmp/e0.csv -w "HTTP %{http_code}, %{size_download} bytes\n" https://www.football-data.co.uk/mmz4281/9394/E0.csv
          head -3 /tmp/e0.csv
          curl -sS -o /tmp/e1.csv -w "HTTP %{http_code}\n" https://www.football-data.co.uk/mmz4281/2627/E0.csv
          tail -2 /tmp/e1.csv
