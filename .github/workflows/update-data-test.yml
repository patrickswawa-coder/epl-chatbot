# [시험용 브랜치 전용] 과거 시즌 경기 결과를 GitHub 서버에서 받아 이 브랜치의 DB에 넣는다. main에는 영향 없음.
name: data-update-test
on:
  push:
    branches: [test/auto-update]
    paths: [".github/workflows/update-data-test.yml", "data_collection/collect_history_results.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 과거 시즌 경기 결과 수집 (2000-01 ~ 2013-14)
        run: python data_collection/collect_history_results.py
      - name: 수집 결과를 이 시험 브랜치에 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add football_history.db
          git diff --cached --quiet || git commit -m "과거 시즌 경기 결과 추가 (자동 수집, 시험 브랜치)"
          git push
